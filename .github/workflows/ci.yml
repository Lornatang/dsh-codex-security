name: CI

on:
  push:
    branches: [main, 'ci/**']
    tags: ['v*']
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-24.04, node: '22.19.0' }
          - { os: ubuntu-24.04, node: '24' }
          - { os: windows-2025, node: '24' }
          - { os: macos-15, node: '24' }
          - { os: macos-15-intel, node: '24' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: git diff --exit-code -- lib
